name: Virtual PC Online

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Defina uma senha para o usuário (ou deixe padrão)'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Limite padrão máximo do plano gratuito do GitHub

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configurar Senha do Usuário
        run: |
          echo "runner:${{ github.event.inputs.access_password }}" | sudo chpasswd
          sudo usermod -aG sudo runner

      - name: Instalar Servidor de Área de Trabalho e Ferramentas
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies tightvncserver wget curl unzip

      - name: Instalar e Autenticar o Ngrok Nativamente
        run: |
          # 1. Adiciona a chave oficial do Ngrok no diretório correto de segurança do Linux
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          
          # 2. Adiciona o repositório estável às fontes do gerenciador de pacotes APT
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/ngrok.asc] https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          
          # 3. Atualiza os índices do sistema e instala o binário oficial atualizado
          sudo apt update && sudo apt install -y ngrok
          
          # 4. Vincula sua conta usando o Secret que você configurou no GitHub
          ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

      - name: Iniciar Servidor VNC
        run: |
          vncserver :1 -geometry 1280x720 -depth 24 &
          echo "Servidor VNC inicializado com sucesso na porta interna 5901"

      - name: Expor VNC via Ngrok (TCP)
        run: |
          # Inicializa o túnel em segundo plano direcionado para a porta do VNC
          ngrok tcp 5901 --log=stdout &
          sleep 5 # Pausa de estabilização essencial para fechar o handshake com o servidor

      - name: Manter a Máquina Ativa
        run: |
          echo "=========================================================="
          echo " 🚀 SEU PC VIRTUAL ESTÁ ONLINE!"
          echo "=========================================================="
          echo "Para conectar:"
          echo "1. Vá até o painel web: https://dashboard.ngrok.com"
          echo "2. Entre na aba 'Endpoints' para pegar o endereço IP e a Porta gerados."
          echo "3. Insira esses dados em um cliente VNC (ex: RealVNC ou TigerVNC)."
          sleep infinity
