name: Virtual PC Windows 10

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Senha do usuário runner'
        required: true
        default: '12345678'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      - name: Verificar Recursos
        run: |
          echo "Memória disponível:"
          free -h

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "Disco:"
          df -h

      - name: Instalar QEMU
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            wget \
            curl \
            ca-certificates \
            unzip \
            netcat-openbsd

      - name: Instalar Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Baixar ISO Windows 10
        env:
          WINDOWS_ISO_URL: "COLE_AQUI_O_LINK_DIRETO_DA_ISO"
        run: |
          mkdir -p ~/windows10
          cd ~/windows10

          if [ -z "$WINDOWS_ISO_URL" ] || [ "$WINDOWS_ISO_URL" = "COLE_AQUI_O_LINK_DIRETO_DA_ISO" ]; then
            echo "ERRO: coloque o link da ISO em WINDOWS_ISO_URL."
            exit 1
          fi

          echo "Baixando ISO do Windows 10..."

          wget \
            --progress=bar:force \
            -O Win10.iso \
            "$WINDOWS_ISO_URL"

          echo ""
          echo "ISO baixada:"
          ls -lh Win10.iso

      - name: Verificar ISO
        run: |
          cd ~/windows10

          if [ ! -f Win10.iso ]; then
            echo "ERRO: ISO não encontrada."
            exit 1
          fi

          SIZE=$(stat -c%s Win10.iso)

          echo "Tamanho da ISO:"
          numfmt --to=iec "$SIZE"

          if [ "$SIZE" -lt 3000000000 ]; then
            echo "ERRO: o arquivo parece não ser uma ISO completa do Windows 10."
            exit 1
          fi

      - name: Criar Disco Windows 10
        run: |
          cd ~/windows10

          qemu-img create \
            -f qcow2 \
            windows10.qcow2 \
            64G

          qemu-img info windows10.qcow2

      - name: Verificar KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo "KVM disponível."
            echo "QEMU_ACCEL=-enable-kvm" >> "$GITHUB_ENV"
          else
            echo "KVM não disponível."
            echo "QEMU_ACCEL=-accel tcg" >> "$GITHUB_ENV"
          fi

      - name: Conectar Tailscale
        env:
          TAILSSCALE_AUTH_KEY: ${{ secrets.TAILSSCALE_AUTH_KEY }}
        run: |
          if [ -z "$TAILSSCALE_AUTH_KEY" ]; then
            echo "ERRO: Secret TAILSSCALE_AUTH_KEY não encontrado."
            exit 1
          fi

          sudo tailscale up \
            --auth-key="$TAILSSCALE_AUTH_KEY" \
            --hostname="windows10-${{ github.run_id }}"

          echo ""
          echo "Tailscale conectado."

          sudo tailscale status

      - name: Iniciar VM Windows 10
        run: |
          cd ~/windows10

          echo "Iniciando Windows 10..."

          qemu-system-x86_64 \
            $QEMU_ACCEL \
            -machine q35 \
            -cpu max \
            -smp 4 \
            -m 16G \
            -drive file=windows10.qcow2,format=qcow2,if=virtio \
            -drive file=Win10.iso,media=cdrom,readonly=on \
            -boot order=d \
            -device virtio-net-pci,netdev=net0 \
            -netdev user,id=net0,hostfwd=tcp:0.0.0.0:3389-:3389 \
            -display none \
            -vnc 127.0.0.1:0 \
            -daemonize \
            -pidfile windows10.pid

          echo "VM iniciada."

      - name: Aguardar Windows
        run: |
          echo ""
          echo "============================================================"
          echo "             AGUARDANDO WINDOWS 10"
          echo "============================================================"
          echo ""

          for i in $(seq 1 120); do

            if ! kill -0 "$(cat ~/windows10/windows10.pid)" 2>/dev/null; then
              echo "A VM foi encerrada."
              exit 1
            fi

            if nc -z 127.0.0.1 3389; then
              echo "Porta RDP detectada."
              break
            fi

            echo "Aguardando Windows... $i/120"

            sleep 30

          done

      - name: Manter a Máquina Ativa
        run: |
          TAILSCALE_IP=$(sudo tailscale ip -4 | head -n 1)

          echo ""
          echo "============================================================"
          echo "                  VIRTUAL PC WINDOWS 10"
          echo "============================================================"
          echo ""
          echo "Nome:              Virtual PC Windows 10"
          echo "Nome amigável:     Virtual PC Windows 10"
          echo "Sistema:           Windows 10 x64"
          echo "RAM:               16 GB"
          echo "CPU:               4 vCPUs"
          echo "Usuário:           runner"
          echo "Senha:             ${{ github.event.inputs.access_password }}"
          echo ""
          echo "PC / Host:         ${TAILSCALE_IP}:3389"
          echo "RDP:               ${TAILSCALE_IP}:3389"
          echo "Tailscale IP:      ${TAILSCALE_IP}"
          echo "Porta RDP:         3389"
          echo ""
          echo "Gateway:           NÃO USAR"
          echo "Acesso direto via Tailscale"
          echo ""
          echo "============================================================"
          echo "                    WINDOWS APP"
          echo "============================================================"
          echo ""
          echo "PC:                ${TAILSCALE_IP}:3389"
          echo "Usuário:           runner"
          echo "Senha:             ${{ github.event.inputs.access_password }}"
          echo "Nome amigável:     Virtual PC Windows 10"
          echo "Gateway:           Não configurado"
          echo ""
          echo "============================================================"
          echo "                       STATUS"
          echo "============================================================"
          echo ""
          echo "Windows 10:        INICIADO"
          echo "Tailscale:         CONECTADO"
          echo "QEMU:              ATIVO"
          echo "RAM:               16 GB"
          echo "CPU:               4 vCPUs"
          echo ""
          echo "A máquina permanecerá ativa."
          echo "============================================================"
          echo ""

          while true; do

            if ! kill -0 "$(cat ~/windows10/windows10.pid)" 2>/dev/null; then
              echo "ERRO: A VM Windows 10 foi encerrada."
              exit 1
            fi

            sleep 60

          done
