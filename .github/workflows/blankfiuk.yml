name: Virtual PC Windows 101

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Senha do usuário runner'
        required: true
        default: '12345678'

jobs:
  windows10:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    permissions:
      contents: read

    steps:

      # ============================================================
      # RECURSOS
      # ============================================================

      - name: Verificar Recursos
        run: |
          echo "============================================================"
          echo "                 RECURSOS DO RUNNER"
          echo "============================================================"
          echo ""

          echo "Memória:"
          free -h

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "Disco:"
          df -h

          echo ""
          echo "KVM:"
          if [ -e /dev/kvm ]; then
            echo "KVM disponível."
          else
            echo "KVM não disponível. Será utilizado TCG."
          fi

      # ============================================================
      # QEMU
      # ============================================================

      - name: Instalar QEMU e Ferramentas
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            genisoimage \
            wget \
            curl \
            ca-certificates \
            netcat-openbsd \
            p7zip-full \
            python3-pip

          echo ""
          echo "QEMU instalado."

          qemu-system-x86_64 --version

      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Instalar Tailscale
        run: |
          echo "Instalando Tailscale..."

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y tailscale

          sudo systemctl enable --now tailscaled

          echo ""
          echo "Tailscale instalado."

          tailscale version

      # ============================================================
      # DIRETÓRIO
      # ============================================================

      - name: Preparar Diretório da VM
        run: |
          mkdir -p "$HOME/windows10"

          echo "Diretório:"
          echo "$HOME/windows10"

      # ============================================================
      # ISO WINDOWS 10
      # ============================================================

      - name: Baixar ISO Windows 10
        env:
          WINDOWS_ISO_URL: "https://drive.google.com/file/d/1rakYlN7p6m3feNrxTzF3QL4sm9cKjQ_K/view?usp=drivesdk"
        run: |
          cd "$HOME/windows10"

          echo "============================================================"
          echo "                DOWNLOAD DO WINDOWS 10"
          echo "============================================================"
          echo ""

          echo "Google Drive detectado."

          python3 -m pip install \
            --user \
            --break-system-packages \
            gdown

          "$HOME/.local/bin/gdown" \
            --fuzzy \
            "$WINDOWS_ISO_URL" \
            -O Win10.iso

          echo ""
          echo "Download concluído."

          ls -lh Win10.iso

      # ============================================================
      # VERIFICAR ISO
      # ============================================================

      - name: Verificar ISO
        run: |
          cd "$HOME/windows10"

          if [ ! -f Win10.iso ]; then
            echo "ERRO: Win10.iso não encontrada."
            exit 1
          fi

          SIZE=$(stat -c%s Win10.iso)

          echo "Tamanho da ISO:"
          numfmt --to=iec "$SIZE"

          if [ "$SIZE" -lt 3000000000 ]; then
            echo ""
            echo "ERRO: A ISO parece pequena demais."
            echo "O download provavelmente não foi concluído corretamente."
            exit 1
          fi

          echo ""
          echo "ISO encontrada e aparentemente válida."

      # ============================================================
      # CRIAR DISCO
      # ============================================================

      - name: Criar Disco Windows 10
        run: |
          cd "$HOME/windows10"

          qemu-img create \
            -f qcow2 \
            windows10.qcow2 \
            64G

          echo ""
          echo "Disco Windows 10 criado."

          qemu-img info windows10.qcow2

      # ============================================================
      # AUTOUNATTEND
      # ============================================================

      - name: Criar Autounattend
        env:
          WINDOWS_PASSWORD: ${{ github.event.inputs.access_password }}
        run: |
          mkdir -p "$HOME/windows10/unattend"

          cat > "$HOME/windows10/unattend/Autounattend.xml" <<EOF
          <?xml version="1.0" encoding="utf-8"?>

          <unattend
              xmlns="urn:schemas-microsoft-com:unattend"
              xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

            <settings pass="windowsPE">

              <component
                name="Microsoft-Windows-International-Core-WinPE"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <SetupUILanguage>
                  <UILanguage>pt-BR</UILanguage>
                </SetupUILanguage>

                <InputLocale>0416:00000416</InputLocale>
                <SystemLocale>pt-BR</SystemLocale>
                <UILanguage>pt-BR</UILanguage>
                <UserLocale>pt-BR</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <DiskConfiguration>

                  <Disk wcm:action="add">

                    <DiskID>0</DiskID>

                    <WillWipeDisk>true</WillWipeDisk>

                    <CreatePartitions>

                      <CreatePartition wcm:action="add">
                        <Order>1</Order>
                        <Type>EFI</Type>
                        <Size>100</Size>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>2</Order>
                        <Type>MSR</Type>
                        <Size>16</Size>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>3</Order>
                        <Type>Primary</Type>
                        <Extend>true</Extend>
                      </CreatePartition>

                    </CreatePartitions>

                    <ModifyPartitions>

                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>FAT32</Format>
                        <Label>System</Label>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>2</Order>
                        <PartitionID>2</PartitionID>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>3</Order>
                        <PartitionID>3</PartitionID>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                        <Letter>C</Letter>
                      </ModifyPartition>

                    </ModifyPartitions>

                  </Disk>

                  <WillShowUI>OnError</WillShowUI>

                </DiskConfiguration>

                <ImageInstall>

                  <OSImage>

                    <InstallFrom>

                      <MetaData
                        wcm:action="add"
                        wcm:keyValue="/IMAGE/INDEX">

                        6

                      </MetaData>

                    </InstallFrom>

                    <InstallTo>

                      <DiskID>0</DiskID>
                      <PartitionID>3</PartitionID>

                    </InstallTo>

                    <WillShowUI>OnError</WillShowUI>

                  </OSImage>

                </ImageInstall>

                <UserData>

                  <AcceptEula>true</AcceptEula>

                  <FullName>runner</FullName>

                  <Organization>Virtual PC</Organization>

                </UserData>

              </component>

            </settings>

            <settings pass="oobeSystem">

              <component
                name="Microsoft-Windows-International-Core"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <InputLocale>0416:00000416</InputLocale>
                <SystemLocale>pt-BR</SystemLocale>
                <UILanguage>pt-BR</UILanguage>
                <UserLocale>pt-BR</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <TimeZone>E. South America Standard Time</TimeZone>

                <ComputerName>VIRTUALPC</ComputerName>

                <OOBE>

                  <HideEULAPage>true</HideEULAPage>

                  <HideLocalAccountScreen>true</HideLocalAccountScreen>

                  <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>

                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>

                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>

                  <NetworkLocation>Home</NetworkLocation>

                  <ProtectYourPC>3</ProtectYourPC>

                </OOBE>

                <UserAccounts>

                  <LocalAccounts>

                    <LocalAccount wcm:action="add">

                      <Name>runner</Name>

                      <DisplayName>runner</DisplayName>

                      <Description>Virtual PC User</Description>

                      <Group>Administrators</Group>

                      <Password>

                        <Value>$WINDOWS_PASSWORD</Value>

                        <PlainText>true</PlainText>

                      </Password>

                    </LocalAccount>

                  </LocalAccounts>

                </UserAccounts>

                <AutoLogon>

                  <Enabled>true</Enabled>

                  <Username>runner</Username>

                  <LogonCount>1</LogonCount>

                  <Password>

                    <Value>$WINDOWS_PASSWORD</Value>

                    <PlainText>true</PlainText>

                  </Password>

                </AutoLogon>

                <FirstLogonCommands>

                  <SynchronousCommand wcm:action="add">

                    <Order>1</Order>

                    <Description>Ativar RDP</Description>

                    <CommandLine>
                      powershell.exe -ExecutionPolicy Bypass -Command "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0"
                    </CommandLine>

                  </SynchronousCommand>

                  <SynchronousCommand wcm:action="add">

                    <Order>2</Order>

                    <Description>Ativar Firewall RDP</Description>

                    <CommandLine>
                      powershell.exe -ExecutionPolicy Bypass -Command "Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'"
                    </CommandLine>

                  </SynchronousCommand>

                  <SynchronousCommand wcm:action="add">

                    <Order>3</Order>

                    <Description>Iniciar RDP</Description>

                    <CommandLine>
                      powershell.exe -ExecutionPolicy Bypass -Command "Set-Service -Name TermService -StartupType Automatic; Start-Service TermService"
                    </CommandLine>

                  </SynchronousCommand>

                </FirstLogonCommands>

              </component>

            </settings>

          </unattend>
          EOF

          echo "Autounattend.xml criado."

      # ============================================================
      # ISO DE AUTOMAÇÃO
      # ============================================================

      - name: Criar ISO de Automação
        run: |
          cd "$HOME/windows10/unattend"

          genisoimage \
            -o "$HOME/windows10/Autounattend.iso" \
            -J \
            -r \
            Autounattend.xml

          echo ""
          echo "ISO de automação criada."

          ls -lh "$HOME/windows10/Autounattend.iso"

      # ============================================================
      # KVM
      # ============================================================

      - name: Configurar Aceleração QEMU
        run: |
          if [ -e /dev/kvm ]; then

            echo "KVM disponível."
            echo "Usando aceleração KVM."

            echo "QEMU_ACCEL=-enable-kvm" >> "$GITHUB_ENV"

          else

            echo "KVM não disponível."
            echo "Usando emulação TCG."

            echo "QEMU_ACCEL=-accel tcg" >> "$GITHUB_ENV"

          fi

      # ============================================================
      # INICIAR WINDOWS
      # ============================================================

      - name: Iniciar Windows 10
        run: |
          cd "$HOME/windows10"

          echo "============================================================"
          echo "                 INICIANDO WINDOWS 10"
          echo "============================================================"
          echo ""

          qemu-system-x86_64 \
            $QEMU_ACCEL \
            -machine q35 \
            -cpu max \
            -smp 4 \
            -m 16G \
            -drive file=windows10.qcow2,format=qcow2,if=ide \
            -drive file=Win10.iso,media=cdrom,readonly=on \
            -drive file=Autounattend.iso,media=cdrom,readonly=on \
            -boot order=d \
            -device e1000,netdev=net0 \
            -netdev user,id=net0,hostfwd=tcp:0.0.0.0:3389-:3389 \
            -display none \
            -daemonize \
            -pidfile windows10.pid

          echo ""
          echo "Windows 10 iniciado."

          sleep 10

          if kill -0 "$(cat windows10.pid)" 2>/dev/null; then
            echo "QEMU está ativo."
          else
            echo "ERRO: QEMU foi encerrado."
            exit 1
          fi

      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Conectar ao Tailscale
        env:
          TAILSSCALE_AUTH_KEY: ${{ secrets.TAILSSCALE_AUTH_KEY }}
        run: |
          if [ -z "$TAILSSCALE_AUTH_KEY" ]; then
            echo "ERRO: Secret TAILSSCALE_AUTH_KEY não encontrado."
            exit 1
          fi

          sudo tailscale up \
            --auth-key="$TAILSSCALE_AUTH_KEY" \
            --hostname="windows10-${{ github.run_id }}"

          echo ""
          echo "============================================================"
          echo "                 TAILSCALE CONECTADO"
          echo "============================================================"
          echo ""

          sudo tailscale status

      # ============================================================
      # AGUARDAR WINDOWS
      # ============================================================

      - name: Aguardar Windows 10
        run: |
          echo ""
          echo "============================================================"
          echo "                AGUARDANDO WINDOWS 10"
          echo "============================================================"
          echo ""

          for i in $(seq 1 120); do

            if ! kill -0 "$(cat ~/windows10/windows10.pid)" 2>/dev/null; then

              echo ""
              echo "ERRO: A VM Windows 10 foi encerrada."
              exit 1

            fi

            if nc -z 127.0.0.1 3389; then

              echo ""
              echo "============================================================"
              echo "                    RDP DISPONÍVEL"
              echo "============================================================"
              echo ""

              exit 0

            fi

            echo "Windows ainda iniciando..."
            echo "Tentativa: $i/120"
            echo ""

            sleep 30

          done

          echo ""
          echo "ERRO: RDP não ficou disponível."
          exit 1

      # ============================================================
      # MANTER MÁQUINA ATIVA
      # ============================================================

      - name: Manter a Máquina Ativa
        run: |
          TAILSCALE_IP=$(sudo tailscale ip -4 | head -n 1)

          echo ""
          echo "============================================================"
          echo "              VIRTUAL PC WINDOWS 10"
          echo "============================================================"
          echo ""
          echo "Nome:              Virtual PC Windows 10"
          echo "Nome amigável:     Virtual PC Windows 10"
          echo "Sistema:           Windows 10 x64"
          echo "RAM:               16 GB"
          echo "CPU:               4 vCPUs"
          echo "Usuário:           runner"
          echo "Senha:             ${{ github.event.inputs.access_password }}"
          echo ""
          echo "PC / Host:         ${TAILSCALE_IP}:3389"
          echo "RDP:               ${TAILSCALE_IP}:3389"
          echo "Tailscale IP:      ${TAILSCALE_IP}"
          echo "Porta RDP:         3389"
          echo ""
          echo "Gateway:           NÃO USAR"
          echo "Acesso:            Tailscale"
          echo ""
          echo "============================================================"
          echo "                    WINDOWS APP"
          echo "============================================================"
          echo ""
          echo "PC:                ${TAILSCALE_IP}:3389"
          echo "Usuário:           runner"
          echo "Senha:             ${{ github.event.inputs.access_password }}"
          echo "Nome amigável:     Virtual PC Windows 10"
          echo "Gateway:           Não configurado"
          echo ""
          echo "============================================================"
          echo "                       STATUS"
          echo "============================================================"
          echo ""
          echo "Windows 10:        ATIVO"
          echo "RDP:               ATIVO"
          echo "Tailscale:         CONECTADO"
          echo "QEMU:              ATIVO"
          echo "RAM:               16 GB"
          echo "CPU:               4 vCPUs"
          echo ""
          echo "A máquina permanecerá ativa."
          echo "============================================================"
          echo ""
