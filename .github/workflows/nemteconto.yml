name: PC Virtual - VNC

on:
  workflow_dispatch:

jobs:
  servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: 01 - Atualizar servidor
        run: |
          sudo apt update
          sudo apt upgrade -y

      - name: 02 - Instalar área de trabalho
        run: |
          sudo apt install -y xfce4 xfce4-goodies
          sudo apt install -y dbus-x11

      - name: 03 - Instalar servidor VNC
        run: |
          sudo apt install -y tigervnc-standalone-server
          sudo apt install -y tigervnc-common

      - name: Adicionado - Instalar Google Chrome
        run: |
          # Baixa e instala a versão estável oficial do Chrome com suas dependências
          wget https://google.com
          sudo apt install ./google-chrome-stable_current_amd64.deb -y

      - name: 04 - Criar usuário
        run: |
          sudo useradd -m -s /bin/bash gamer || true
          echo "gamer:gamer" | sudo chpasswd
          sudo usermod -aG sudo gamer

      - name: 05 - Configurar área de trabalho
        run: |
          sudo -u gamer mkdir -p /home/gamer/.vnc
          
          # Correção crucial: injeta a senha 'gamer' para o VNC Viewer não dar Erro 1
          echo "gamer" | vncpasswd -f > /tmp/passwd
          sudo mv /tmp/passwd /home/gamer/.vnc/passwd
          sudo chmod 600 /home/gamer/.vnc/passwd
          
          # Define a inicialização limpa da interface gráfica
          echo -e "#!/bin/sh\nunset SESSION_MANAGER\nunset DBUS_SESSION_BUS_ADDRESS\nstartxfce4 &" > /tmp/xstartup
          sudo mv /tmp/xstartup /home/gamer/.vnc/xstartup
          sudo chmod +x /home/gamer/.vnc/xstartup
          
          # Aplica a permissão correta para o usuário gamer ser dono de tudo
          sudo chown -R gamer:gamer /home/gamer/.vnc

      - name: 06 - Instalar ferramentas
        run: |
          sudo apt install -y curl wget unzip net-tools jq

      - name: 07 - Instalar Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update
          sudo apt install -y ngrok

      - name: 08 - Configurar Ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          ngrok config add-authtoken "$NGROK_TOKEN"

      - name: 09 - Iniciar servidor VNC
        run: |
          # Remove bloqueios antigos residuais para garantir inicialização limpa
          sudo -u gamer vncserver -kill :1 || true
          sudo rm -f /tmp/.X11-unix/X1 /tmp/.X1-lock || true
          
          # Inicializa o VNC corrigido
          sudo -u gamer vncserver :1 \
            -geometry 1280x720 \
            -depth 24

      - name: 10 - Verificar VNC
        run: |
          sleep 3
          ss -lntp | grep 5901 || true

      - name: 11 - Iniciar túnel
        run: |
          nohup ngrok tcp 5901 > /tmp/ngrok.log 2>&1 &
          sleep 8

      - name: 12 - Mostrar conexão
        run: |
          # Captura e exibe o link de forma limpa no painel para facilitar cópia
          URL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url')
          echo "================================================"
          echo "🚀 LINK DE CONEXÃO: $URL"
          echo "🔒 SENHA DO VNC: gamer"
          echo "================================================"

      - name: 13 - Manter servidor ativo
        run: |
          echo "PC virtual iniciado."
          echo "O servidor ficará ativo enquanto este workflow estiver executando."
          sleep infinity
