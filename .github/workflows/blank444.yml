name: PC

on:
  workflow_dispatch:

jobs:
  servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: 01 - Atualizar servidor
        run: |
          sudo apt update
          sudo apt upgrade -y

      - name: 02 - Instalar área de trabalho
        run: |
          sudo apt install -y xfce4 xfce4-goodies
          sudo apt install -y dbus-x11

      - name: 03 - Instalar servidor VNC
        run: |
          sudo apt install -y tigervnc-standalone-server
          sudo apt install -y tigervnc-common

      - name: 04 - Criar usuário
        run: |
          sudo useradd -m -s /bin/bash gamer || true
          echo "gamer:gamer" | sudo chpasswd
          sudo usermod -aG sudo gamer

      - name: 05 - Configurar área de trabalho
        run: |
          sudo -u gamer mkdir -p /home/gamer/.vnc
          
          # DEFINE A SENHA DO VNC AUTOMATICAMENTE
          echo "gamer" | vncpasswd -f > /tmp/passwd
          sudo mv /tmp/passwd /home/gamer/.vnc/passwd
          sudo chmod 600 /home/gamer/.vnc/passwd
          
          # Inicia a interface gráfica
          echo "startxfce4" | sudo tee /home/gamer/.vnc/xstartup
          sudo chmod +x /home/gamer/.vnc/xstartup
          
          # Garante as permissões corretas para o usuário gamer
          sudo chown -R gamer:gamer /home/gamer/.vnc

      - name: 06 - Instalar ferramentas
        run: |
          sudo apt install -y curl wget unzip net-tools

      - name: 09 - Iniciar servidor VNC
        run: |
          # CORREÇÃO DO ERRO 1: Limpa sessões antigas e arquivos temporários de travas
          sudo -u gamer vncserver -kill :1 || true
          sudo rm -f /tmp/.X11-unix/X1 /tmp/.X1-lock || true
          
          sudo -u gamer vncserver :1 \
            -geometry 1280x720 \
            -depth 24

      - name: 10 - Verificar VNC
        run: |
          sleep 3
          ss -lntp | grep 5901 || true

      - name: 11 e 12 - Iniciar Túnel Grátis (Sem Ngrok)
        run: |
          echo ""
          echo "================================================================"
          echo "🚀 PC VIRTUAL LIGADO COM SUCESSO!"
          echo "🔗 COPIE O LINK DA LINHA 'tcp.pinggy.link' ABAIXO NO SEU VNC VIEWER"
          echo "🔒 SENHA DE ACESSO DO VNC: gamer"
          echo "================================================================"
          echo ""
          
          # Inicia o túnel em segundo plano (&) para o script poder avançar para o passo 13
          nohup ssh -o StrictHostKeyChecking=no -p 443 -R 0.0.0.0:5901:localhost:5901 tcp.pinggy.io > /tmp/pinggy.log 2>&1 &
          sleep 5
          
          # Mostra o link gerado pelo Pinggy na tela do GitHub
          cat /tmp/pinggy.log | grep -o 'tcp.pinggy.link:[0-dev9]*' || cat /tmp/pinggy.log

      - name: 13 - Manter servidor ativo
        run: |
          echo "PC virtual iniciado."
          echo "O servidor ficará ativo enquanto este workflow estiver executando."
          sleep infinity
