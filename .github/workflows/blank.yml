name: Windows Virtual PC - Roblox Funcional

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest # Máquina Windows original da Microsoft
    timeout-minutes: 330

    steps:
      - name: 01 - Instalar e Configurar Tailscale
        shell: pwsh
        env:
          TS_KEY: \${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          # Baixa e instala o Tailscale para Windows de forma silenciosa
          Invoke-WebRequest -Uri "https://tailscale.com" -OutFile "ts-setup.exe"
          Start-Process -FilePath ".\ts-setup.exe" -ArgumentList "/quiet" -Wait
          
          # Autentica a máquina na sua conta privada do Tailscale
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey "\$env:TS_KEY" --accept-routes
          
          # Captura o IP para você conectar pelo celular
          \$tsIP = (& "C:\Program Files\Tailscale\tailscale.exe" ip -4).Trim()
          echo "TAILSCALE_IP=tsIP" >> env:GITHUB_ENV

      - name: 02 - Habilitar Acesso Remoto e Criar Usuário
        shell: pwsh
        run: |
          # Liga as permissões de Área de Trabalho Remota do Windows (RDP)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Cria o usuário 'gamer' com a senha 'Gamer1234!'
          \$Password = ConvertTo-SecureString "Gamer1234!" -AsPlainText -Force
          New-LocalUser "gamer" -Password \$Password -Description "Usuario Gamer"
          Add-LocalGroupMember -Group "Administrators" -Member "gamer"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "gamer"

      - name: 03 - Instalar Suporte a Gráficos 3D para o Roblox
        shell: pwsh
        run: |
          # Baixa o Mesa3D que simula a placa de vídeo por processador
          Invoke-WebRequest -Uri "https://github.com" -OutFile "mesa3d.7z"
          
          # Extrai os arquivos utilizando o descompactador padrão do Windows
          7z x mesa3d.7z -o"C:\mesa3d" -y
          
          # Injeta a placa virtual (opengl32.dll) no sistema do Windows para habilitar o 3D
          Copy-Item "C:\mesa3d\x64\opengl32.dll" -Destination "C:\Windows\System32\" -Force
          Write-Host "Driver de video injetado com sucesso!"

      - name: Maintain Connection
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          
          Write-Host "`n================================================"
          Write-Host "🚀 SEU WINDOWS COM GRÁFICOS 3D ESTÁ PRONTO!"
          Write-Host "🔗 ENDEREÇO (Computer IP): $env:TAILSCALE_IP"
          Write-Host "👤 USUÁRIO (Username): gamer"
          Write-Host "🔒 SENHA (Password): Gamer1234!"
          Write-Host "================================================`n"
          
          # Mantém o Windows ativo continuamente
          while (\$true) {
              Write-Host "[\$(Get-Date)] Windows Ativo - Use o Windows App no Celular"
              Start-Sleep -Seconds 300
          }
