name: Virtual P

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Defina uma senha para o usuário (ou deixe padrão)'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      - name: Repositório de Checkout
        uses: actions/checkout@v4

      - name: Configurar Senha do Usuário
        run: |
          echo "runner:${{ github.event.inputs.access_password }}" | sudo chpasswd
          sudo usermod -aG sudo runner

      - name: Instalar Servidor de Área de Trabalho e Ferramentas
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            tightvncserver \
            dbus-x11 \
            wget \
            curl \
            ca-certificates

      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Instalar Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Conectar ao Tailscale
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if [ -z "$TAILSCALE_AUTHKEY" ]; then
            echo "ERRO: TAILSCALE_AUTHKEY não foi disponibilizado pelo GitHub."
            exit 1
          fi

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTHKEY" \
            --hostname="virtual-pc-${{ github.run_id }}"

          echo "Tailscale conectado com sucesso."

      - name: Mostrar Endereço Tailscale
        run: |
          echo "========================================="
          echo "        VIRTUAL PC ONLINE"
          echo "========================================="
          echo ""
          echo "Tailscale IPv4:"
          tailscale ip -4
          echo ""
          echo "Tailscale IPv6:"
          tailscale ip -6 || true
          echo ""
          echo "Hostname:"
          tailscale status --self
          echo ""
          echo "========================================="

      # ============================================================
      # CONFIGURAR VNC
      # ============================================================

      - name: Configurar VNC e XFCE
        env:
          VNC_PASSWORD: ${{ github.event.inputs.access_password }}
        run: |
          mkdir -p ~/.vnc

          # Criar senha do VNC
          echo "$VNC_PASSWORD" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          # Configurar XFCE
          cat > ~/.vnc/xstartup <<'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce

          dbus-launch --exit-with-session startxfce4 &
          EOF

          chmod +x ~/.vnc/xstartup

      - name: Iniciar Servidor VNC
        run: |
          vncserver -kill :1 >/dev/null 2>&1 || true

          vncserver :1 \
            -geometry 1280x720 \
            -depth 24 \
            -localhost no

          echo "========================================="
          echo "VNC iniciado."
          echo "Porta: 5901"
          echo "========================================="

      # ============================================================
      # NGROK
      # ============================================================

      - name: Instalar o Ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list >/dev/null

          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Configurar Ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          if [ -z "$NGROK_TOKEN" ]; then
            echo "ERRO: NGROK_TOKEN não foi disponibilizado pelo GitHub."
            exit 1
          fi

          ngrok config add-authtoken "$NGROK_TOKEN"

      - name: Expor VNC via Ngrok (TCP)
        run: |
          nohup ngrok tcp 5901 > /tmp/ngrok.log 2>&1 &

          sleep 5

          echo "========================================="
          echo "NGROK"
          echo "========================================="

          cat /tmp/ngrok.log || true

          echo ""
          echo "========================================="

      # ============================================================
      # INFORMAÇÕES FINAIS
      # ============================================================

      - name: Mostrar Informações de Acesso
        run: |
          echo ""
          echo "=============================================="
          echo "          VIRTUAL PC PRONTO"
          echo "=============================================="
          echo ""
          echo "TAILSCALE:"
          echo "IP:"
          tailscale ip -4
          echo ""
          echo "Para acessar pelo Tailscale:"
          echo "IP_TAILSCALE:5901"
          echo ""
          echo "VNC:"
          echo "Porta: 5901"
          echo "Resolução: 1280x720"
          echo ""
          echo "NGROK:"
          echo "Veja o endereço TCP acima ou em:"
          echo "/tmp/ngrok.log"
          echo ""
          echo "=============================================="

      # ============================================================
      # MANTER O PC ATIVO
      # ============================================================

      - name: Manter a Máquina Ativa
        run: |
          echo "PC Virtual pronto!"
          echo "Tailscale ativo."
          echo "VNC ativo."
          echo "Ngrok ativo."
          echo ""
          echo "A máquina permanecerá ativa até o limite do workflow."
          sleep infinity
