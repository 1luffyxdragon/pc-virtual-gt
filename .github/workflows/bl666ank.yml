name: Virtual PC Windows 10

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Senha do Windows'
        required: true
        default: '12345678'

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:

      - name: Preparar sistema
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            xorriso \
            curl \
            netcat-openbsd \
            freerdp2-x11 \
            xvfb

          python3 -m pip install \
            --user \
            --break-system-packages \
            gdown

          echo "Espaço disponível:"
          df -h

      - name: Liberar espaço
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean

          echo "Espaço após limpeza:"
          df -h

      - name: Instalar Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo systemctl enable --now tailscaled

      - name: Baixar Windows 10
        run: |
          mkdir -p ~/windows10

          ~/.local/bin/gdown \
            "1rakYlN7p6m3feNrxTzF3QL4sm9cKjQ_K" \
            -O ~/windows10/Win10.iso

          echo "ISO:"
          ls -lh ~/windows10/Win10.iso

      - name: Criar disco virtual
        run: |
          qemu-img create \
            -f qcow2 \
            ~/windows10/windows10.qcow2 \
            40G

          qemu-img info ~/windows10/windows10.qcow2

      - name: Criar Autounattend
        env:
          PASSWORD: ${{ github.event.inputs.access_password }}
        run: |
          python3 <<'PY'
          import os
          from xml.sax.saxutils import escape

          password = escape(os.environ["PASSWORD"])

          xml = f'''<?xml version="1.0" encoding="utf-8"?>

          <unattend
            xmlns="urn:schemas-microsoft-com:unattend"
            xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

            <settings pass="windowsPE">

              <component
                name="Microsoft-Windows-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <DiskConfiguration>

                  <Disk wcm:action="add">
                    <DiskID>0</DiskID>
                    <WillWipeDisk>true</WillWipeDisk>

                    <CreatePartitions>

                      <CreatePartition wcm:action="add">
                        <Order>1</Order>
                        <Type>Primary</Type>
                        <Extend>true</Extend>
                      </CreatePartition>

                    </CreatePartitions>

                    <ModifyPartitions>

                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                        <Letter>C</Letter>
                        <Active>true</Active>
                      </ModifyPartition>

                    </ModifyPartitions>

                  </Disk>

                  <WillShowUI>OnError</WillShowUI>

                </DiskConfiguration>

                <ImageInstall>

                  <OSImage>

                    <InstallFrom>

                      <MetaData
                        wcm:action="add"
                        wcm:keyValue="/IMAGE/INDEX">
                        4
                      </MetaData>

                    </InstallFrom>

                    <InstallTo>
                      <DiskID>0</DiskID>
                      <PartitionID>1</PartitionID>
                    </InstallTo>

                    <WillShowUI>OnError</WillShowUI>

                  </OSImage>

                </ImageInstall>

                <UserData>

                  <AcceptEula>true</AcceptEula>

                  <FullName>runner</FullName>

                  <Organization>Virtual PC</Organization>

                  <ProductKey>
                    <Key>VK7JG-NPHTM-C97JM-9MPGT-3V66T</Key>
                    <WillShowUI>Never</WillShowUI>
                  </ProductKey>

                </UserData>

              </component>

            </settings>

            <settings pass="specialize">

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <ComputerName>VIRTUALPC</ComputerName>

              </component>

              <component
                name="Microsoft-Windows-Deployment"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <RunSynchronous>

                  <RunSynchronousCommand wcm:action="add">
                    <Order>1</Order>
                    <Path>
                      powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0"
                    </Path>
                  </RunSynchronousCommand>

                  <RunSynchronousCommand wcm:action="add">
                    <Order>2</Order>
                    <Path>
                      powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 0"
                    </Path>
                  </RunSynchronousCommand>

                  <RunSynchronousCommand wcm:action="add">
                    <Order>3</Order>
                    <Path>
                      powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-Service TermService -StartupType Automatic"
                    </Path>
                  </RunSynchronousCommand>

                  <RunSynchronousCommand wcm:action="add">
                    <Order>4</Order>
                    <Path>
                      powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-Service UmRdpService -StartupType Automatic"
                    </Path>
                  </RunSynchronousCommand>

                  <RunSynchronousCommand wcm:action="add">
                    <Order>5</Order>
                    <Path>
                      powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'"
                    </Path>
                  </RunSynchronousCommand>

                  <RunSynchronousCommand wcm:action="add">
                    <Order>6</Order>
                    <Path>
                      powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Set-NetFirewallRule -DisplayGroup 'Remote Desktop' -Enabled True"
                    </Path>
                  </RunSynchronousCommand>

                </RunSynchronous>

              </component>

            </settings>

            <settings pass="oobeSystem">

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <OOBE>

                  <HideEULAPage>true</HideEULAPage>

                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>

                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>

                  <ProtectYourPC>3</ProtectYourPC>

                </OOBE>

                <UserAccounts>

                  <LocalAccounts>

                    <LocalAccount wcm:action="add">

                      <Name>runner</Name>

                      <DisplayName>runner</DisplayName>

                      <Description>Virtual PC User</Description>

                      <Group>Administrators</Group>

                      <Password>
                        <Value>{password}</Value>
                        <PlainText>true</PlainText>
                      </Password>

                    </LocalAccount>

                  </LocalAccounts>

                </UserAccounts>

                <AutoLogon>

                  <Enabled>true</Enabled>

                  <Username>runner</Username>

                  <LogonCount>10</LogonCount>

                  <Password>
                    <Value>{password}</Value>
                    <PlainText>true</PlainText>
                  </Password>

                </AutoLogon>

              </component>

            </settings>

          </unattend>
          '''

          with open(
              os.path.expanduser("~/windows10/Autounattend.xml"),
              "w",
              encoding="utf-8"
          ) as f:
              f.write(xml)

          print("Autounattend criado.")

      - name: Criar ISO de resposta
        run: |
          cd ~/windows10

          mkdir -p answer

          cp Autounattend.xml answer/Autounattend.xml

          xorriso \
            -as mkisofs \
            -iso-level 3 \
            -V "AUTOUNATTEND" \
            -o Autounattend.iso \
            answer/

          ls -lh Autounattend.iso

      - name: Instalar Windows
        run: |
          cd ~/windows10

          rm -f qemu-install.log

          qemu-system-x86_64 \
            -accel tcg \
            -machine q35 \
            -cpu max \
            -smp 4 \
            -m 16G \
            -drive file=windows10.qcow2,format=qcow2,if=ide \
            -drive file=Win10.iso,media=cdrom,readonly=on \
            -drive file=Autounattend.iso,media=cdrom,readonly=on \
            -boot order=d \
            -nic user,model=e1000 \
            -display none \
            -serial file:qemu-install.log \
            -daemonize \
            -pidfile qemu-install.pid

          echo "Instalador do Windows iniciado."

          echo "Aguardando instalação automática..."

          for i in $(seq 1 50); do

            echo "Instalação: $i/50"

            if ! kill -0 $(cat qemu-install.pid) 2>/dev/null; then
              echo "QEMU terminou a instalação/boot inicial."
              break
            fi

            sleep 30

          done

          echo "Processo QEMU:"
          ps aux | grep qemu-system | grep -v grep || true

      - name: Reiniciar Windows pelo disco
        run: |
          cd ~/windows10

          if [ -f qemu-install.pid ]; then
            kill "$(cat qemu-install.pid)" 2>/dev/null || true
            sleep 5
          fi

          rm -f qemu-run.log

          qemu-system-x86_64 \
            -accel tcg \
            -machine q35 \
            -cpu max \
            -smp 4 \
            -m 16G \
            -drive file=windows10.qcow2,format=qcow2,if=ide \
            -boot order=c \
            -nic user,model=e1000,hostfwd=tcp:0.0.0.0:3389-:3389 \
            -display none \
            -serial file:qemu-run.log \
            -daemonize \
            -pidfile qemu-run.pid

          echo "Windows iniciado pelo disco."

          sleep 10

      - name: Conectar Tailscale
        env:
          TAILSSCALE_AUTH_KEY: ${{ secrets.TAILSSCALE_AUTH_KEY }}
        run: |
          sudo tailscale up \
            --auth-key="$TAILSSCALE_AUTH_KEY" \
            --hostname="windows10-${{ github.run_id }}"

          echo ""
          echo "Tailscale:"
          sudo tailscale status

      - name: Aguardar Windows e testar RDP
        env:
          PASSWORD: ${{ github.event.inputs.access_password }}
        run: |
          echo "Aguardando Windows 10..."

          for i in $(seq 1 60); do

            echo ""
            echo "Tentativa $i/60"

            if ! nc -z 127.0.0.1 3389 2>/dev/null; then
              echo "Windows ainda não abriu RDP."
              sleep 20
              continue
            fi

            echo "Porta 3389 disponível."

            rm -f /tmp/rdp-test.log

            if timeout 30 xvfb-run -a \
              xfreerdp \
              /v:127.0.0.1:3389 \
              /u:runner \
              /p:"$PASSWORD" \
              /cert:ignore \
              /sec:rdp \
              +auth-only \
              >/tmp/rdp-test.log 2>&1; then

              echo ""
              echo "============================================"
              echo "       RDP REALMENTE DISPONÍVEL"
              echo "============================================"

              cat /tmp/rdp-test.log || true

              exit 0
            fi

            echo "RDP ainda não aceitou autenticação."

            tail -20 /tmp/rdp-test.log || true

            sleep 20

          done

          echo ""
          echo "============================================"
          echo "ERRO: RDP NÃO FICOU DISPONÍVEL"
          echo "============================================"

          echo ""
          echo "QEMU:"
          ps aux | grep qemu-system | grep -v grep || true

          echo ""
          echo "Porta:"
          nc -vz 127.0.0.1 3389 || true

          echo ""
          echo "RDP:"
          cat /tmp/rdp-test.log 2>/dev/null || true

          echo ""
          echo "Tailscale:"
          sudo tailscale status || true

          echo ""
          echo "Serial QEMU:"
          tail -100 ~/windows10/qemu-run.log 2>/dev/null || true

          exit 1

      - name: Manter a Máquina Ativa
        run: |
          IP=$(sudo tailscale ip -4)

          echo ""
          echo "============================================"
          echo "       VIRTUAL PC WINDOWS 10"
          echo "============================================"
          echo "Nome:          Virtual PC Windows 10"
          echo "Sistema:       Windows 10 Pro"
          echo "Usuário:       runner"
          echo "Senha:         ${{ github.event.inputs.access_password }}"
          echo "PC / Host:     $IP"
          echo "Tailscale IP:  $IP"
          echo "RDP:           $IP:3389"
          echo "CPU:           4 vCPUs"
          echo "RAM:           16 GB"
          echo "============================================"
          echo ""
          echo "WINDOWS APP"
          echo "--------------------------------------------"
          echo "Nome do computador: $IP"
          echo "Conta:              runner"
          echo "Senha:              ${{ github.event.inputs.access_password }}"
          echo "Nome amigável:      Virtual PC Windows 10"
          echo "Gateway:            Nenhum gateway"
          echo "--------------------------------------------"
          echo ""
          echo "No Windows App:"
          echo ""
          echo "Computador:"
          echo "$IP"
          echo ""
          echo "Conta:"
          echo "runner"
          echo ""
          echo "Senha:"
          echo "${{ github.event.inputs.access_password }}"
          echo ""
          echo "Gateway:"
          echo "Nenhum gateway"
          echo ""
          echo "A VM permanecerá ativa."
          echo ""

          sleep infinity
